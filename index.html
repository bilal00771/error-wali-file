<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Locked</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#eef4ff,#dfe9ff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:650px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    padding:40px;
    text-align:center;
}

.bg-icon{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:220px;
    color:rgba(24,119,242,.05);
    user-select:none;
    pointer-events:none;
}

.card{
    position:relative;
    overflow:hidden;
}

.lock{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#1877F2;
    margin-bottom:15px;
}

p{
    color:#444;
    line-height:1.7;
    font-size:17px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 28px;
    background:#1877F2;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container card">

<div class="bg-icon">🔒</div>

<div class="lock">🔐</div>

<h1>Account Locked</h1>

<p>
We think your account is locked.<br>
Kindly unlock your account and submit your appeal again.
</p>

<a href="#" class="btn">Try Again</a>

</div>

</body>
</html>
